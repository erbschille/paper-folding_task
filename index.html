<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Folding Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato','Helvetica Neue',Arial,sans-serif;background:#f0f0f0;color:#1a1a1a}

/* ── Pre-experiment overlay ─────────────────── */
#pre-experiment{position:fixed;inset:0;z-index:9999;background:#f0f0f0;
  display:flex;justify-content:center;align-items:center}
.pre-card{background:#fff;border-radius:10px;padding:48px 56px;max-width:460px;
  width:100%;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,.10)}
.pre-card h2{font-size:22px;font-weight:700;margin-bottom:8px}
.pre-card p{font-size:15px;color:#777;margin-bottom:22px;line-height:1.5}
.pre-card label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#888;margin-bottom:8px}
#pid-input{font-family:'Lato',sans-serif;font-size:20px;padding:10px 16px;
  width:200px;text-align:center;border:2px solid #ddd;border-radius:7px;
  outline:none;transition:border-color .2s;letter-spacing:.04em}
#pid-input:focus{border-color:#3a7bd5}
#pid-input.error{border-color:#e74c3c}
#start-btn{display:block;width:200px;margin:18px auto 0;padding:12px;
  font-family:'Lato',sans-serif;font-size:16px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;background:#3a7bd5;
  color:#fff;border:none;border-radius:7px;cursor:pointer;transition:background .2s}
#start-btn:hover{background:#2f67ba}

/* ── Main screen ────────────────────────────── */
#main{display:none;min-height:100vh}

/* ── Instructions ───────────────────────────── */
.inst-wrap{max-width:800px;margin:0 auto;padding:52px 32px 64px}
.inst-wrap p{font-size:16px;line-height:1.85;margin-bottom:14px;text-align:justify}
.inst-wrap .sample-img{display:block;max-width:100%;margin:28px auto}
.inst-wrap .cue{margin-top:32px;font-weight:700;font-size:16px}
.inst-wrap .begin-row{text-align:center;margin-top:32px}

/* ── Timer bar ──────────────────────────────── */
#timer-bar{position:sticky;top:0;z-index:100;background:#fff;
  border-bottom:2px solid #e0e0e0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;gap:12px}
#part-label{font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#555;min-width:130px}
#timer-display{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
  color:#222;transition:color .3s;min-width:70px;text-align:center}
#timer-display.warn{color:#e67e22}
#timer-display.urgent{color:#e74c3c}
#answered-count{font-size:14px;color:#888;min-width:120px;text-align:center}
#submit-btn{padding:9px 22px;font-family:'Lato',sans-serif;font-size:14px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:#3a7bd5;color:#fff;border:none;border-radius:7px;
  cursor:pointer;transition:background .2s;white-space:nowrap}
#submit-btn:hover{background:#2f67ba}

/* ── Test image with canvas overlay ────────── */
#test-container{position:relative;display:block;max-width:900px;margin:16px auto;
  user-select:none}
#test-img{display:block;width:100%;height:auto}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair}

/* ── Hint strip ─────────────────────────────── */
#click-hint{text-align:center;font-size:13px;color:#888;padding:6px 0 16px;
  font-style:italic}

/* ── Break / End screens ────────────────────── */
.break-wrap{max-width:560px;margin:0 auto;padding:80px 24px;text-align:center}
.break-wrap h2{font-size:24px;margin-bottom:16px}
.break-wrap p{font-size:16px;color:#555;line-height:1.7;margin-bottom:10px}
.end-wrap{max-width:640px;margin:0 auto;padding:60px 24px;text-align:center}
.end-wrap h2{font-size:26px;margin-bottom:20px}
.score-card{background:#fff;border-radius:10px;padding:28px 32px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px;text-align:left}
.score-big{font-size:42px;font-weight:700;color:#3a7bd5;text-align:center;
  padding:8px 0 12px}
.score-card table{width:100%;border-collapse:collapse;font-size:15px}
.score-card td{padding:7px 4px;border-bottom:1px solid #f0f0f0}
.score-card td:first-child{color:#666}
.score-card td:last-child{font-weight:700;text-align:right}
.btn{padding:12px 36px;font-family:'Lato',sans-serif;font-size:16px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:#3a7bd5;color:#fff;border:none;border-radius:8px;
  cursor:pointer;transition:background .2s}
.btn:hover{background:#2f67ba}
kbd{display:inline-block;padding:2px 9px;font-family:monospace;font-size:13px;
  background:#f4f4f4;border:1px solid #ccc;border-bottom:2px solid #999;border-radius:4px}
</style>
</head>
<body>

<div id="pre-experiment">
  <div class="pre-card">
    <h2>Paper Folding Test</h2>
    <p>Two parts &ndash; 3 minutes each<br>Enter the Participant ID to begin.</p>
    <label for="pid-input">Participant ID</label>
    <input id="pid-input" type="text" placeholder="e.g. P001"
           autocomplete="off" spellcheck="false">
    <button id="start-btn">Begin</button>
  </div>
</div>

<div id="main">
  <div id="timer-bar" style="display:none">
    <span id="part-label">PART ONE</span>
    <span id="timer-display">3:00</span>
    <span id="answered-count">0 / 10 answered</span>
    <button id="submit-btn" onclick="endPart(true)">Submit Part &rarr;</button>
  </div>
  <div id="content"></div>
</div>

/* ── Helpers ─────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function mm_ss(s){
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

/* ── Timer ───────────────────────────────────── */
function startTimer(onExpire){
  timerSec = 180;
  updateTimerDisplay();
  timerInt = setInterval(() => {
    timerSec--;
    updateTimerDisplay();
    if(timerSec <= 0){ clearInterval(timerInt); onExpire(); }
  }, 1000);
}
function stopTimer(){ clearInterval(timerInt); }
function updateTimerDisplay(){
  const el = $('timer-display');
  if(!el) return;
  el.textContent = mm_ss(timerSec);
  el.className = timerSec <= 30 ? 'urgent' : timerSec <= 60 ? 'warn' : '';
}

/* ── Canvas overlay ──────────────────────────── */
function redrawSelections(){
  const canvas = $('overlay');
  const img    = $('test-img');
  if(!canvas || !img) return;

  // Match canvas pixel size to the displayed image size
  canvas.width  = img.offsetWidth;
  canvas.height = img.offsetHeight;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const layout    = curPart === 1 ? P1_LAYOUT : P2_LAYOUT;
  const itemStart = curPart === 1 ? 1 : 11;

  for(const [key, ch] of Object.entries(responses)){
    const n = parseInt(key);
    const rowIdx = n - itemStart;
    const colIdx = 'ABCDE'.indexOf(ch);
    if(rowIdx < 0 || rowIdx >= 10 || colIdx < 0) continue;

    const row = layout.rows[rowIdx];
    const col = layout.cols[colIdx];
    const cw = canvas.width, ch2 = canvas.height;

    const x = col.s * cw;
    const w = (col.e - col.s) * cw;
    const fullY = row.s * ch2;
    const fullH = (row.e - row.s) * ch2;

    // Centre of the true cell (X tracks this)
    const cx = x + w/2, cy = fullY + fullH/2;

    // Uniform box width (fraction of image width), so every column —
    // including the wider option A — renders the same size.
    const BOX_W = 0.075;
    const bw = BOX_W * cw;
    const bx = cx - bw/2;

    // Shrink the box vertically so it doesn't extend above where it should.
    // BOX_VSCALE < 1 makes the box shorter; it stays re-centred on the cell.
    // BOX_VSHIFT > 0 nudges the box down (fraction of cell height).
    const BOX_VSCALE = 0.72;
    const BOX_VSHIFT = 0.13;
    const h = fullH * BOX_VSCALE;
    const y = cy - h/2 + fullH * BOX_VSHIFT;

    // Semi-transparent blue highlight
    ctx.fillStyle = 'rgba(58,123,213,0.18)';
    ctx.fillRect(bx, y, bw, h);

    // Blue border
    ctx.strokeStyle = '#3a7bd5';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(bx+1, y+1, bw-2, h-2);
    const arm = Math.min(bw, h) * 0.28;
    const xcy = y + h/2;   // X centred inside the (nudged) box
    ctx.strokeStyle = '#1a5bbf';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx-arm, xcy-arm); ctx.lineTo(cx+arm, xcy+arm);
    ctx.moveTo(cx+arm, xcy-arm); ctx.lineTo(cx-arm, xcy+arm);
    ctx.stroke();
  }

  // Update answered count
  const itemEnd = itemStart + 9;
  const n = Object.keys(responses).filter(k=>{ const v=parseInt(k); return v>=itemStart&&v<=itemEnd; }).length;
  const ac = $('answered-count');
  if(ac) ac.textContent = n + ' / 10 answered';
}

function handleCanvasClick(e){
  const canvas = $('overlay');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const fx = (e.clientX - rect.left)  / rect.width;
  const fy = (e.clientY - rect.top)   / rect.height;

  const layout = curPart === 1 ? P1_LAYOUT : P2_LAYOUT;

  let colIdx = -1;
  for(let i = 0; i < layout.cols.length; i++){
    if(fx >= layout.cols[i].s && fx < layout.cols[i].e){ colIdx = i; break; }
  }
  if(colIdx < 0) return;

  let rowIdx = -1;
  for(let i = 0; i < layout.rows.length; i++){
    if(fy >= layout.rows[i].s && fy < layout.rows[i].e){ rowIdx = i; break; }
  }
  if(rowIdx < 0) return;

  const itemStart = curPart === 1 ? 1 : 11;
  const n  = itemStart + rowIdx;
  const ch = 'ABCDE'[colIdx];

  // Toggle off if clicking same choice again
  if(responses[n] === ch){ delete responses[n]; }
  else { responses[n] = ch; }

  redrawSelections();
}

       the correct answer.</p>

    <img class="sample-img" src="${SAMPLE_A_SRC}" alt="Sample explanation">

    <p>In these problems all of the folds that are made are shown in the figures at the
       left of the line, and the paper is not turned or moved in any way except to make
       the folds shown in the figures. Remember, the answer is the figure that shows the
       positions of the holes when the paper is completely unfolded.</p>

    <p>Some of the problems on this sheet are more difficult than others. If you are
       unable to do one of the problems, simply skip over it and go on to the next one.</p>

    <p>You will have three minutes for each of the two parts of this test. Each part has
       one page.</p>

    <div class="begin-row">
      <button class="btn" onclick="startPart(1)">Begin Part One &rarr;</button>
    </div>
  </div>`;

  const h = e => {
    if(e.code === 'Space'){
      e.preventDefault();
      document.removeEventListener('keydown', h);
      startPart(1);
    }
  };
  document.addEventListener('keydown', h);
}

function startPart(part){
  curPart  = part;
  responses = {};
  if(resizeObs){ resizeObs.disconnect(); resizeObs = null; }

  timerBar.style.display = 'flex';
  $('part-label').textContent = part === 1 ? 'PART ONE' : 'PART TWO';
  $('answered-count').textContent = '0 / 10 answered';

  const imgSrc = part === 1 ? P1_SRC : P2_SRC;

  content.innerHTML = `
    <div id="test-container">
      <img id="test-img" src="${imgSrc}" alt="Part ${part} test items">
      <canvas id="overlay"></canvas>
    </div>
    <p id="click-hint">Click an answer figure (A–E) to select it. Click again to deselect.</p>`;

  // Attach click handler
  const canvas = $('overlay');
  canvas.addEventListener('click', handleCanvasClick);

  // Resize canvas whenever image reflows
  resizeObs = new ResizeObserver(() => redrawSelections());
  resizeObs.observe($('test-img'));

  // Initial draw once image is sized
  const img = $('test-img');
  if(img.complete){ redrawSelections(); }
  else { img.onload = () => redrawSelections(); }

  startTimer(() => endPart(false));
}

function endPart(manual){
  stopTimer();
  if(resizeObs){ resizeObs.disconnect(); resizeObs = null; }
  timerBar.style.display = 'none';

  // Commit responses to allData
  const itemStart = curPart === 1 ? 1 : 11;
  for(let n = itemStart; n <= itemStart+9; n++){
    const resp = responses[n] || null;
    const corr = ANSWERS[n];
    allData.push({
      participant_id: pid,
      session:        SESSION,
      session_start:  sessionStart,
      part:           curPart,
      item_num:       n,
      response:       resp,
      correct_answer: corr,
      is_correct:     resp === null ? null : resp === corr,
      time_remaining_ms: timerSec * 1000,
      submitted_manually: manual,
    });
  }

  if(curPart === 1){ showBreak(); }
  else { showEndScreen(); }
}

function showBreak(){
  content.innerHTML = `
  <div class="break-wrap">
    <h2>Part One Complete</h2>
    <p>You have finished Part One. You may take a short break.</p>
    <p style="margin-top:20px">When you are ready, press <kbd>spacebar</kbd>
       or click below to begin Part Two.</p>
    <div style="text-align:center;margin-top:28px">
      <button class="btn" onclick="startPart(2)">Begin Part Two &rarr;</button>
    </div>
  </div>`;
  const h = e => {
    if(e.code === 'Space'){
      e.preventDefault();
      document.removeEventListener('keydown', h);
      startPart(2);
    }
  };
  document.addEventListener('keydown', h);
}

/* ── Scoring + end ───────────────────────────── */
function showEndScreen(){
  function stats(p){
    const rs = allData.filter(r => r.part === p);
    const c  = rs.filter(r => r.is_correct === true).length;
    const w  = rs.filter(r => r.is_correct === false).length;
    const sk = rs.filter(r => r.is_correct === null).length;
    return { c, w, sk, raw: (c - w/4).toFixed(2) };
  }
  const s1 = stats(1), s2 = stats(2);
  const tC = s1.c+s2.c, tW = s1.w+s2.w, tSk = s1.sk+s2.sk;
  const tR = (tC - tW/4).toFixed(2);

  // Compact results sent to Qualtrics (each key becomes one column, prefixed pf_).
  // "responses" = the 20 answers as one string, in item order ("-" = no answer).
  const responses20 = Array.from({length:20}, (_, i) =>
    (allData.find(r => r.item_num === i + 1) || {}).response || '-').join('');
  const summary = {
    responses:  responses20,
    correct:    tC,
    wrong:      tW,
    skipped:    tSk,
    raw:        Number(tR),
    p1_correct: s1.c,
    p2_correct: s2.c,
    p1_raw:     Number(s1.raw),
    p2_raw:     Number(s2.raw),
  };

  // Embedded in Qualtrics: send the data and hand control back. No results screen.
  if (EMBEDDED) {
    postToParent(summary);
    content.innerHTML = '<div class="end-wrap"><p style="color:#888;font-size:15px">Saving your responses&hellip;</p></div>';
    return;
  }

  const downloadedMsg = EMBEDDED
    ? 'Your responses have been recorded.'
    : 'Your data has been downloaded automatically.';

  content.innerHTML = `
  <div class="end-wrap">
    <h2>Test Complete</h2>
    <div class="score-card">
      <div class="score-big">${tR} / 20</div>
      <table>
        <tr><td></td>
            <td style="font-weight:700;text-align:right;color:#555">Part 1</td>
            <td style="font-weight:700;text-align:right;color:#555">Part 2</td>
            <td style="font-weight:700;text-align:right;color:#555">Total</td></tr>
        <tr><td>Correct</td><td>${s1.c}</td><td>${s2.c}</td><td>${tC}</td></tr>
        <tr><td>Wrong</td><td>${s1.w}</td><td>${s2.w}</td><td>${tW}</td></tr>
        <tr><td>Skipped / unanswered</td><td>${s1.sk}</td><td>${s2.sk}</td><td>${tSk}</td></tr>
        <tr><td>Raw score (correct &minus; wrong&divide;4)</td>
            <td>${s1.raw}</td><td>${s2.raw}</td><td>${tR}</td></tr>
      </table>
    </div>
    <p style="color:#888;font-size:14px;margin-bottom:20px">
      Score = correct &minus; (wrong &divide; 4). Maximum = 20.<br>
      ${downloadedMsg}
    </p>
    ${EMBEDDED ? '' : '<button class="btn" onclick="downloadCSV()">Download Data Again (CSV)</button>'}
  </div>`;

  // When not embedded, auto-download as a local backup.
  if(!EMBEDDED) setTimeout(downloadCSV, 200);
}

/* Send results to the Qualtrics page that is hosting this task.
   Message format is shared by every task: {type, task, data}.
   Contains only scores/answers (no name, no ID), so '*' is safe here. */
let _sent = false;
function postToParent(data){
  if(_sent || window.parent === window) return;
  _sent = true;
  window.parent.postMessage({ type: 'task_complete', task: 'paperfolding', data: data }, '*');
}

function downloadCSV(){
  if(!allData.length) return;
  const keys = Object.keys(allData[0]);
  const esc = v => {
    if(v === null || v === undefined) return '';
    const s = String(v);
    return s.includes(',') || s.includes('"') || s.includes('\n')
      ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const csv = [keys.join(','),
    ...allData.map(r => keys.map(k => esc(r[k])).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'),
    { href: url, download: `paper_folding_${pid}_${Date.now()}.csv` });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ── Launch ──────────────────────────────────── */
const pidInput = $('pid-input');
const startBtn = $('start-btn');

const launch = () => {
  pid = pidInput.value.trim();
  if(!pid){ pidInput.classList.add('error'); pidInput.focus(); return; }
  sessionStart = new Date().toISOString();
  $('pre-experiment').style.display = 'none';
  main.style.display = 'block';
  showInstructions();
};
startBtn.addEventListener('click', launch);
pidInput.addEventListener('keydown', e => { if(e.key === 'Enter') launch(); });
pidInput.addEventListener('input',   () => pidInput.classList.remove('error'));

/* If a participant ID was supplied via the URL (e.g. from Qualtrics),
   pre-fill it and start automatically, skipping the manual entry screen. */
if(URL_PID || EMBEDDED){          // inside Qualtrics: never show the manual ID screen
  pidInput.value = URL_PID || 'unknown';
  launch();
}

</script>
</body>
</html>
